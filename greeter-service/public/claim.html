<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claim your free Website Greeter | The Night Shift</title><style>body{margin:0;background:#071d29;color:#eef5f7;font:16px system-ui;padding:40px}.wrap{max-width:720px;margin:auto}h1{font-size:clamp(32px,7vw,56px);line-height:1;margin:.2em 0}p,label{line-height:1.55}form{display:grid;gap:14px;margin-top:28px;background:#103444;padding:24px;border-radius:18px}input,textarea,select{font:inherit;padding:12px;border-radius:8px;border:1px solid #4e6974}textarea{min-height:120px}button{background:#fb7b20;color:#071d29;font-weight:800;border:0;border-radius:8px;padding:14px;cursor:pointer}.note{color:#b9d3da;font-size:.9rem}</style><main class="wrap"><p>THE DEERFIELD AI NIGHT SCHOOL</p><h1>Claim your free Website Greeter.</h1><p>We create a private preview from information you approve. Nothing goes on your live site until you test it, approve it, and paste the supplied embed into your own website.</p><form id="claim"><label>Business name<input name="businessName" required></label><label>Website URL<input name="websiteUrl" type="url" required></label><label>Your name<input name="contactName"></label><label>Email<input name="contactEmail" type="email" required></label><label>Human escalation email or phone<input name="humanEscalation" required></label><label>Primary next step<select name="primaryCta"><option>Request a quote</option><option>Call us</option><option>Book now</option><option>Order now</option><option>Send an inquiry</option></select></label><label>Public guidebook / FAQ URL (optional)<input name="publicSourceUrl" type="url"></label><label>Approved Business Context Pack<textarea name="approvedContext" required placeholder="Paste only approved public FAQs, services, policies, hours, and contact information. Do not include passwords, payment data, IDs, or private customer records."></textarea></label><label class="note"><input type="checkbox" required> I confirm this is approved business information and I can authorize a preview.</label><button>Build my private preview</button><p id="result" role="status"></p></form></main><script>document.querySelector('#claim').addEventListener('submit',async e=>{e.preventDefault();const r=document.querySelector('#result'),b=e.currentTarget.querySelector('button');b.disabled=true;r.textContent='Creating your secure preview request…';const data=Object.fromEntries(new FormData(e.currentTarget));const res=await fetch('/api/claims',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const body=await res.json();r.textContent=res.ok?'Request received. Check your email for the private preview link.':body.error||'Unable to submit. Please try again.';b.disabled=false})</script></html>
