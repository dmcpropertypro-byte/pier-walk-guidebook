<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make Your Property Impossible to Forget | The Night Shift Studio</title>
<meta name="description" content="AI operations and brand storytelling for independent hospitality owners who want stronger margins and a property guests remember.">
<link rel="icon" href="/brand/the-night-shift-studio-punch-clock.png">
<style>
  :root{--night:#09131f;--orange:#f0821e;--white:#f4f7f9}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--night);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:inherit;text-decoration:none}
  .hero{position:relative;height:100svh;min-height:560px;overflow:hidden;background:var(--night);isolation:isolate}
  .hero:after{position:absolute;inset:0;z-index:1;content:"";pointer-events:none;background:linear-gradient(180deg,rgba(9,19,31,.68),rgba(9,19,31,.08) 32%,rgba(9,19,31,.16) 58%,rgba(9,19,31,.9)),linear-gradient(90deg,rgba(9,19,31,.42),transparent 70%)}
  video,.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  video{z-index:0}.poster{z-index:1;transition:opacity .6s ease}.playing .poster{opacity:0}
  .topbar{position:absolute;inset:0 0 auto;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:22px clamp(20px,5vw,56px)}
  .brand{display:inline-flex;align-items:center;gap:12px;font-size:clamp(15px,1.7vw,19px);font-weight:900;letter-spacing:-.02em;text-shadow:0 2px 16px rgba(0,0,0,.58)}
  .brand img{width:48px;height:48px;object-fit:cover;border-radius:11px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .site{color:rgba(255,255,255,.78);font-size:12px;font-weight:800;letter-spacing:.08em}
  .content{position:absolute;inset:auto 0 0;z-index:3;padding:0 clamp(20px,5vw,56px) clamp(34px,7vh,66px)}
  .eyebrow{margin:0 0 13px;color:var(--orange);font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.65)}
  h1{max-width:15ch;margin:0;color:#fff;font-family:Georgia,"Times New Roman",serif;font-size:clamp(43px,7.2vw,94px);font-weight:600;letter-spacing:-.045em;line-height:.9;text-shadow:0 4px 28px rgba(0,0,0,.66)}
  .lede{max-width:620px;margin:22px 0 0;color:rgba(255,255,255,.86);font-size:clamp(15px,1.6vw,19px);font-weight:600;text-shadow:0 2px 14px rgba(0,0,0,.75)}
  .cta{display:inline-flex;align-items:center;gap:11px;margin-top:24px;padding:14px 23px;border-radius:999px;background:var(--orange);color:var(--night);font-size:14px;font-weight:900;box-shadow:0 14px 36px rgba(240,130,30,.35);transition:transform .2s ease,box-shadow .2s ease}
  .cta:hover{transform:translateY(-2px);box-shadow:0 18px 42px rgba(240,130,30,.48)}
  .sound{position:absolute;right:clamp(20px,5vw,56px);bottom:clamp(34px,7vh,66px);z-index:4;display:grid;place-items:center;width:48px;height:48px;border:1px solid rgba(255,255,255,.45);border-radius:50%;background:rgba(9,19,31,.55);color:#fff;cursor:pointer;backdrop-filter:blur(8px)}
  @media(max-width:650px){.hero{min-height:640px}.site{display:none}.content{padding-bottom:108px}h1{max-width:12ch}.sound{bottom:32px}}
  @media(prefers-reduced-motion:reduce){video{display:none}.poster{opacity:1}.cta{transition:none}}
</style>
</head>
<body>
<main class="hero" id="hero">
  <img class="poster" src="/pw-poster.jpg" alt="Pier Walk on Deerfield Beach poolside at sunset">
  <video id="video" poster="/pw-poster.jpg" muted autoplay loop playsinline preload="metadata" aria-hidden="true"><source src="/pw-hero-720.mp4" type="video/mp4"></video>
  <header class="topbar">
    <a class="brand" href="/" aria-label="The Night Shift Studio home"><img src="/brand/the-night-shift-studio-punch-clock.png" alt="" aria-hidden="true"><span>The Night Shift Studio</span></a>
    <a class="site" href="/">thenightshift.studio</a>
  </header>
  <section class="content" aria-labelledby="unforgettable-title">
    <p class="eyebrow">AI Operations + Brand Storytelling</p>
    <h1 id="unforgettable-title">Make your property impossible to forget.</h1>
    <p class="lede">Build a business that works harder—and a brand your guests remember.</p>
    <a class="cta" href="/">Enter The Night Shift Studio <span>→</span></a>
  </section>
  <button class="sound" id="sound" type="button" aria-label="Turn video sound on"><span aria-hidden="true">🔇</span></button>
</main>
<script>
(function(){
  var video=document.getElementById('video'),hero=document.getElementById('hero'),sound=document.getElementById('sound');
  function markPlaying(){hero.classList.add('playing')}
  video.addEventListener('playing',markPlaying);if(video.readyState>=3)markPlaying();
  var play=video.play();if(play&&play.catch)play.catch(function(){});
  sound.addEventListener('click',function(){video.muted=!video.muted;sound.querySelector('span').textContent=video.muted?'🔇':'🔊';sound.setAttribute('aria-label',video.muted?'Turn video sound on':'Mute video');if(video.paused)video.play()});
}());
</script>
</body>
</html>
